services:
  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: copilot
      POSTGRES_DB: copilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the shell or a .env file}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
